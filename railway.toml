# Cervantes Realty site — static Vite SPA on Railway
# Supabase is already configured in src/config/supabase.ts (facelift project).

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npx serve -s dist -l tcp://0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
